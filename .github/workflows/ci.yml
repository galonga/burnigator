name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all PHP files
        run: |
          find . -name '*.php' -not -path './assets/vendor/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null

  js-syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check first-party JS parses
        run: |
          find assets sw.js -name '*.js' -not -path 'assets/vendor/*' -print0 \
            | xargs -0 -n1 node --check

  version-bump:
    name: Build number and cache version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/check-version-bump.sh "$BASE_SHA" HEAD
