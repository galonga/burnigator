name: Bug report
description: Something does not work as expected
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security problems, please do not use this form. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the admin panel
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Visitor map
        - Visitor timetable
        - Pinboard / event authentication
        - Admin panel
        - Setup wizard
        - Installable app / offline
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: PHP version, web server or host, and browser.
      placeholder: PHP 8.3, Apache, Firefox on Android
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Please remove passwords, tokens and personal data.
