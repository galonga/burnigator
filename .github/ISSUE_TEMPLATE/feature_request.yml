name: Feature request
description: Suggest an idea or improvement
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who is affected (guests, organizers, operators) and what is hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
